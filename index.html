<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>趣味のなる木</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<div class="app-container">
    <header>
        <h1>🌳 趣味のなる木</h1>
        <p>罪悪感ゼロ！今月も楽しく使い切ろう</p>
    </header>

    <!-- 木のビジュアルエリア -->
    <div class="tree-section">
        <div class="tree-visual" id="treeVisual">
            <div class="tree-leaves"></div>
            <div class="fruits-container" id="fruitsContainer">
                <!-- JavaScriptでここに実を生成 -->
            </div>
            <div class="tree-trunk"></div>
        </div>
    </div>

    <!-- お財布ステータス -->
    <div class="status-card">
        <div class="status-label">自由に使える残り予算</div>
        <div class="status-amount" id="remainingBudgetDisplay">¥0</div>
        <div class="status-total" id="totalBudgetDisplay">（今月の予算：¥0）</div>
    </div>

    <!-- 支出入力 -->
    <div class="input-section">
        <div class="section-title">いくら使った？</div>
        <div class="amount-grid">
            <button class="btn-amount" onclick="selectAmount(100)">+100</button>
            <button class="btn-amount" onclick="selectAmount(500)">+500</button>
            <button class="btn-amount" onclick="selectAmount(1000)">+1000</button>
            <button class="btn-amount" onclick="selectAmount(5000)">+5000</button>
        </div>
        <div class="input-display" id="inputAmountDisplay">入力中: ¥0</div>

        <div class="section-title">何に使った？</div>
        <div class="category-grid">
            <button class="btn-category" onclick="selectCategory('🎮', this)"><span class="icon">🎮</span></button>
            <button class="btn-category" onclick="selectCategory('🍻', this)"><span class="icon">🍻</span></button>
            <button class="btn-category" onclick="selectCategory('📚', this)"><span class="icon">📚</span></button>
            <button class="btn-category" onclick="selectCategory('🛍️', this)"><span class="icon">🛍️</span></button>
        </div>

        <button class="btn-submit" id="submitBtn" onclick="submitExpense()" disabled>記録する！</button>
    </div>

    <!-- 各種アクション -->
    <div class="action-section">
        <div class="flex-actions">
            <button class="btn-secondary" onclick="toggleBudgetSetup()">📅 給料日が来た</button>
            <button class="btn-secondary btn-danger" onclick="chopTree()">🪓 木を切り倒す</button>
        </div>

        <!-- 給料日予算入力 -->
        <div class="budget-setup-box" id="budgetSetupBox">
            <div class="budget-desc">次の給料日までの「自由枠予算」を設定：</div>
            <div class="input-group">
                <input type="number" id="newBudgetInput" placeholder="例: 30000" pattern="[0-9]*">
                <button class="btn-save-budget" onclick="processSalaryDay()">設定</button>
            </div>
            <div class="budget-note">※残った予算は自動的に貯金（木の実）になります。</div>
        </div>
    </div>
</div>

</body>
</html>
